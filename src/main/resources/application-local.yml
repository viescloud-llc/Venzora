server:
  port: 8085

jwt.secret: 'local'

# Database configuration flags
# DATABASE_TYPE: 'mysql'
DATABASE_TYPE: 'h2'

# Common datasource configuration
spring:
  jpa:
    hibernate:
      ddl-auto: update
      # ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        webAllowOthers: true
        autostart: true
  boot:
    admin:
      client:
        url: url
        enable: false
        auto-registration: true
        instance:
          name: Venzora

# actuator
management:
  endpoints:
    health:
      show-details: always
    web:
      exposure:
        include: "*"

# checkout
paypal:
  clientId: ${PAYPAL_CLIENT_ID:}
  clientSecret: ${PAYPAL_CLIENT_SECRET:}
  sandbox: ${PAYPAL_SANDBOX:true}
  webhookId: ${PAYPAL_WEBHOOK_ID:}
  restApiBaseUrl: ${PAYPAL_REST_API_BASE_URL:}

# -----------------------------------H2 specific configuration-----------------------------------

H2_DB: './h2'
H2_USERNAME: 'sa'
H2_PASSWORD: ''

# -----------------------------------MySQL specific configuration-----------------------------------

MYSQL_HOST: '10.24.24.2'
MYSQL_PORT: 3306
MYSQL_DB: 'Venzora'
MYSQL_USERNAME: 'venzora'
MYSQL_PASSWORD: 'venzora'
MYSQL_USE_SSL: 'false'

# -----------------------------------Redis specific configuration-----------------------------------
REDIS_ENABLED: false
REDIS_HOST: "localhost"
REDIS_PORT: 6379
REDIS_USERNAME:
REDIS_PASSWORD:

# -----------------------------------Paypal checkout configuration-----------------------------------
# PAYPAL_CLIENT_ID: 
# PAYPAL_CLIENT_SECRET:
# PAYPAL_SANDBOX: true
# PAYPAL_WEBHOOK_ID:
# (usually this blank)
